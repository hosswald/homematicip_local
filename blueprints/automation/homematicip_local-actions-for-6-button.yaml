blueprint:
  name: Actions for 6-Button Homematic(IP) device
  description:
    When a button is pressed, the defined actions will be executed. Please
    keep in mind, that long-press actions might be executed multiple times, according
    to your configured minimum duration for long press. This can be configured in
    your CCU.
    Tested with HmIP-WRC6. Should work with other device too.
    v2022-10-28
  domain: automation
  source_url: https://github.com/sukramj/homematicip_local/blob/devel/blueprints/automation/homematicip_local-actions-for-6-button.yaml
  input:
    remote:
      name: 6-Button Devices
      description: Please select one or more 6-Button devices of your Homematic(IP) Local integration.
      selector:
        device:
          integration: homematicip_local
          multiple: true

    notify_on_direct_links:
      name: Warn when CCU direct connections exist
      description: >
        If enabled, Home Assistant will create a persistent notification when the pressed channel
        has direct CCU links (peers). This is the "grey-out equivalent": you get a warning at runtime.
      default: true
      selector:
        boolean: {}

    skip_actions_when_direct_link:
      name: Skip actions when CCU direct connection exists
      description: >
        If enabled, the blueprint will NOT run the configured actions for a button press when that
        channel has direct CCU links (peers), to avoid duplicate behavior (CCU + HA).
      default: false
      selector:
        boolean: {}

    action_left_top_short:
      name: Action
      description: Left-Top-Button, Short Press
      default: []
      selector:
        action: {}
    action_left_top_long:
      name: Action
      description: Left-Top-Button, Long Press
      default: []
      selector:
        action: {}
    action_right_top_short:
      name: Action
      description: Right-Top-Button, Short Press
      default: []
      selector:
        action: {}
    action_right_top_long:
      name: Action
      description: Right-Top-Button, Long Press
      default: []
      selector:
        action: {}
    action_left_middle_short:
      name: Action
      description: Left-Middle-Button, Short Press
      default: []
      selector:
        action: {}
    action_left_middle_long:
      name: Action
      description: Left-Middle-Button, Long Press
      default: []
      selector:
        action: {}
    action_right_middle_short:
      name: Action
      description: Right-Middle-Button, Short Press
      default: []
      selector:
        action: {}
    action_right_middle_long:
      name: Action
      description: Right-Middle-Button, Long Press
      default: []
      selector:
        action: {}
    action_left_bottom_short:
      name: Action
      description: Left-Bottom-Button, Short Press
      default: []
      selector:
        action: {}
    action_left_bottom_long:
      name: Action
      description: Left-Bottom-Button, Long Press
      default: []
      selector:
        action: {}
    action_right_bottom_short:
      name: Action
      description: Right-Bottom-Button, Short Press
      default: []
      selector:
        action: {}
    action_right_bottom_long:
      name: Action
      description: Right-Bottom-Button, Long Press
      default: []
      selector:
        action: {}

variables:
  remotes: !input remote
  notify_on_direct_links: !input notify_on_direct_links
  skip_actions_when_direct_link: !input skip_actions_when_direct_link

trigger:
  - platform: event
    event_type: homematic.keypress

condition:
  - condition: template
    value_template: >-
      {% set selected = remotes if remotes is list else [remotes] %}
      {{ trigger.event.data.device_id in selected }}

action:
  - variables:
      channel: "{{ trigger.event.data.subtype }}"

  - service: homematicip_local.get_link_peers
    data:
      device_id: "{{ trigger.event.data.device_id }}"
      channel: "{{ channel }}"
    response_variable: link_peers

  - variables:
      direct_link_peer_count: >-
        {% set lists = (link_peers.values() | list) if link_peers is mapping else [] %}
        {{ lists | map('count') | sum }}
      has_direct_link: "{{ (direct_link_peer_count | int(0)) > 0 }}"

  - choose:
      - conditions:
          - condition: template
            value_template: "{{ notify_on_direct_links and has_direct_link }}"
        sequence:
          - service: persistent_notification.create
            data:
              title: "Homematic CCU direct connection detected"
              message: >-
                Device {{ trigger.event.data.device_id }}, channel {{ channel }} has direct CCU links (peers).
                The CCU may already handle this button directly. Consider removing the direct connection
                if you want Home Assistant to be the only handler.
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ skip_actions_when_direct_link }}"
                sequence:
                  - stop: "Skipped blueprint actions: CCU direct connection exists for this channel."

  - choose:
      - conditions:
          - condition: template
            value_template: "{{ trigger.event.data.type  == 'press_short' and trigger.event.data.subtype  == 1 }}"
        sequence: !input "action_left_top_short"
      - conditions:
          - condition: template
            value_template: "{{ trigger.event.data.type  == 'press_long' and trigger.event.data.subtype  == 1 }}"
        sequence: !input "action_left_top_long"
      - conditions:
          - condition: template
            value_template: "{{ trigger.event.data.type  == 'press_short' and trigger.event.data.subtype  == 2 }}"
        sequence: !input "action_right_top_short"
      - conditions:
          - condition: template
            value_template: "{{ trigger.event.data.type  == 'press_long' and trigger.event.data.subtype  == 2 }}"
        sequence: !input "action_right_top_long"
      - conditions:
          - condition: template
            value_template: "{{ trigger.event.data.type  == 'press_short' and trigger.event.data.subtype  == 3 }}"
        sequence: !input "action_left_middle_short"
      - conditions:
          - condition: template
            value_template: "{{ trigger.event.data.type  == 'press_long' and trigger.event.data.subtype  == 3 }}"
        sequence: !input "action_left_middle_long"
      - conditions:
          - condition: template
            value_template: "{{ trigger.event.data.type  == 'press_short' and trigger.event.data.subtype  == 4 }}"
        sequence: !input "action_right_middle_short"
      - conditions:
          - condition: template
            value_template: "{{ trigger.event.data.type  == 'press_long' and trigger.event.data.subtype  == 4 }}"
        sequence: !input "action_right_middle_long"
      - conditions:
          - condition: template
            value_template: "{{ trigger.event.data.type  == 'press_short' and trigger.event.data.subtype  == 5 }}"
        sequence: !input "action_left_bottom_short"
      - conditions:
          - condition: template
            value_template: "{{ trigger.event.data.type  == 'press_long' and trigger.event.data.subtype  == 5 }}"
        sequence: !input "action_left_bottom_long"
      - conditions:
          - condition: template
            value_template: "{{ trigger.event.data.type  == 'press_short' and trigger.event.data.subtype  == 6 }}"
        sequence: !input "action_right_bottom_short"
      - conditions:
          - condition: template
            value_template: "{{ trigger.event.data.type  == 'press_long' and trigger.event.data.subtype  == 6 }}"
        sequence: !input "action_right_bottom_long"

mode: parallel
max: 10